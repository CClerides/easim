<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Easim">
  <!--
    The chip from the Easim card, drawn rather than cropped.

    A favicon is read at 16px. The photograph on the hero has the whole card
    in it - wordmark, strapline, bevel - and all of that turns to mud at that
    size, so the mark here is just the contact pad: six pads, two rules and a
    spine, which is the shape everyone already recognises as a SIM. The gold
    is sampled from the card in the hero so the two read as one brand, and the
    ground is the same ink as the site's primary button.
  -->
  <rect width="32" height="32" rx="7" fill="#14171c"/>
  <rect x="6.5" y="8" width="19" height="16" rx="2.5" fill="#d8b878"/>
  <g stroke="#14171c" stroke-width="1.5" stroke-linecap="round">
    <path d="M6.5 13.3h19M6.5 18.7h19"/>
    <path d="M16 8v16"/>
  </g>
</svg>
